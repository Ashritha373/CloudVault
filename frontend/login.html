<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudVault — Authentication</title>
  <meta name="description" content="Sign in or register for CloudVault self-healing distributed cloud storage.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(at 10% 10%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.03) 0px, transparent 50%);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      z-index: 10;
    }

    .auth-card {
      padding: 2.25rem 2rem;
      border-radius: var(--radius-lg);
      background: #ffffff;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-modal);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-logo-wrap {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem auto;
      border-radius: var(--radius-md);
      background: var(--color-primary-subtle);
      color: var(--color-primary);
      border: 1px solid var(--color-primary-border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-xs);
    }

    .auth-logo-wrap svg {
      width: 26px;
      height: 26px;
    }

    .auth-header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 0 0 0.35rem 0;
      letter-spacing: -0.02em;
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 0.84rem;
      margin: 0;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-muted);
      padding: 3px;
      border-radius: var(--radius-sm);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }

    .auth-tab {
      flex: 1;
      padding: 0.55rem;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-tab.active {
      background: #ffffff;
      color: var(--color-primary-text);
      box-shadow: var(--shadow-xs);
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .form-control {
      width: 100%;
      padding: 0.65rem 0.85rem;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      transition: all var(--transition-fast);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-control::placeholder {
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--color-primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error {
      background: var(--color-danger-subtle);
      border: 1px solid var(--color-danger-border);
      color: var(--color-danger-text);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      margin-bottom: 1.15rem;
      display: none;
    }

    .auth-footer-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.905 0-5.64-.78-8.006-2.141m16.012 0a9 9 0 00-16.012 0" />
          </svg>
        </div>
        <h1>CloudVault</h1>
        <p>Distributed Self-Healing Cloud Storage</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">Sign In</button>
        <button type="button" class="auth-tab" id="tab-register">Register</button>
      </div>

      <div class="auth-error" id="auth-error"></div>

      <!-- Login Form -->
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" id="btn-login">Sign In to CloudVault</button>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit" id="btn-register">Create Account</button>
      </form>

      <div class="auth-footer-note">
        Protected with JWT Authentication & AES Chunk Encryption
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Redirect if already authenticated
    if (CloudVaultAuth.getToken()) {
      window.location.href = 'index.html';
    }

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authError = document.getElementById('auth-error');

    function showError(msg) {
      authError.textContent = msg;
      authError.style.display = 'block';
    }

    function hideError() {
      authError.style.display = 'none';
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
      hideError();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = 'block';
      formLogin.style.display = 'none';
      hideError();
    });

    // Handle Login
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch(`${CloudVaultAuth.API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });
        const contentType = res.headers.get('content-type') || '';
        let data;
        if (contentType.includes('application/json')) {
          data = await res.json();
        } else {
          throw new Error(`Server returned non-JSON response (${res.status}). Please ensure the CloudVault backend server is running on port 3000.`);
        }
        if (!res.ok) throw new Error(data.error || 'Login failed');

        CloudVaultAuth.setAuth(data.token, data.user);
        window.location.href = 'index.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to CloudVault';
      }
    });

    // Handle Register
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        const res = await fetch(`${CloudVaultAuth.API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
          })
        });
        const contentType = res.headers.get('content-type') || '';
        let data;
        if (contentType.includes('application/json')) {
          data = await res.json();
        } else {
          throw new Error(`Server returned non-JSON response (${res.status}). Please ensure the CloudVault backend server is running on port 3000.`);
        }
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        CloudVaultAuth.setAuth(data.token, data.user);
        window.location.href = 'index.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
